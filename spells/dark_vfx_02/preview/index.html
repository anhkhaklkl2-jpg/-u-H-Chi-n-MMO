// ===== Renderer config (DO TEMPLATE — chỉ sửa config khi vibe code) =====
const FPS = 6;                 // fps animation debuff
const LOOPS = 1;               // số vòng play trước khi tắt (1 = play 1 lần)
const STACK_GAP_MS = 200;      // chống spam: 2 lần kích hoạt cách nhau tối thiểu

// ============================================================
// ⚙️ ENGINE
// ============================================================
const imgs = [];
let loaded = false;
function loadAll(){
  const keys = Object.keys(FRAME_DATA).sort();
  return Promise.all(keys.map(k => new Promise((res, rej) => {
    const im = new Image(); im.src = "data:image/png;base64," + FRAME_DATA[k];
    im.onload = () => res(im); im.onerror = () => rej(new Error("missing frame " + k));
    imgs.push(im);
  })));
}

let autoCast = true, scale2x = true;
let lastFrameTime = 0;
const caster = { x: 60, y: 140 };

const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const log = document.getElementById("log");

// mob test
const mobs = [
  { x: 320, y: 110, hp: 50, maxHp: 50 },
  { x: 150, y: 200, hp: 50, maxHp: 50 },
];
const MOB_R = 13;

// debuff đang chạy trên từng mob
const debuffs = new Map(); // mob -> { frame, t, lastTrigger }
let lastFrameAt = 0;
let activeDebuffs = [];

function trigger(mx, my){
  // tìm mob tại (mx, my)
  const m = mobs.find(m => (m.x-mx)**2 + (m.y-my)**2 <= 16*16);
  if (!m){ log.textContent = "Không trúng mob — click lên 1 mob màu đỏ."; return; }
  const now = performance.now();
  existing();
  function existing(){
    const d = debuffs.get(m);
    if (d && now - d.lastTrigger < STACK_GAP_MS) { log.textContent = "⏳ spam guard (" + STACK_GAP_MS + "ms)"; return; }
    debuffs.set(m, { frame: 0, t: 0, lastTrigger: now });
    log.textContent = "✨ DEBUFF tại mob (" + m.x + ", " + m.y + ") — fps=" + FPS + ", loops=" + LOOPS;
  }
}

canvas.addEventListener("click", e => {
  const r = canvas.getBoundingClientRect();
  trigger((e.clientX - r.left) * canvas.width / r.width, (e.clientY - r.top) * canvas.height / r.height);
});

function update(dt){
  const now = performance.now();
  const key = performance.now();
  for (const [m, d] of debuffs){
    d.t += dt;
    d.lastTrigger = d.lastTrigger; // giữ nguyên
    if (d.t >= 1000 / FPS){
      d.t = 0;
      d.frame++;
      if (d.frame >= imgs.length){
        if (LOOPS > 1){ d.frame = 0; d.loopN = (d.loopN||1) + 1; if (d.loopN >= LOOPS) debuffs.delete(m); }
        else debuffs.delete(m);
      }
    }
  }
}

function drawChecker(){
  ctx.fillStyle = "#1c2430";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = "#232c3a";
  for (let y=0; y<canvas.height; y+=24)
    for (let x=0; x<canvas.width; x+=24)
      if (((x+y)/24)%2===0) ctx.fillRect(x,y,24,24);
  ctx.fillStyle = "#fc0";
  ctx.fillRect(caster.x-4, caster.y-4, 8, 8);
  ctx.strokeStyle = "#000";
  ctx.strokeRect(caster.x-4, caster.y-4, 8, 8);
}

function render(){
  drawChecker();
  for (const m of mobs){
    ctx.fillStyle = "#a33";
    ctx.fillRect(m.x-MOB_R, m.y-MOB_R, MOB_R*2, MOB_R*2);
    ctx.strokeStyle = "#000";
    ctx.strokeRect(m.x-MOB_R, m.y-MOB_R, MOB_R*2, MOB_R*2);
    // hp bar
    ctx.fillStyle = "#300";
    ctx.fillRect(m.x-MOB_R, m.y-MOB_R-7, MOB_R*2, 4);
    ctx.fillStyle = "#4d4";
    ctx.fillRect(m.x-MOB_R, m.y-MOB_R-7, MOB_R*2 * (m.hp/m.maxHp), 4);
    ctx.fillStyle = "#fff"; ctx.font = "9px monospace"; ctx.textAlign = "center";
    ctx.fillText(m.hp + "/" + m.maxHp, m.x, m.y + MOB_R + 10);
  }
  // debuff overlay TRÊN mob: căn giữa, chân align chân mob
  const s = scale2x ? 2 : 1;
  for (const [m, d] of debuffs){
    const im = imgs[d.frame];
    if (!im) continue;
    const w = im.width * s, h = im.height * s;
    ctx.drawImage(im, m.x - w/2, m.y + MOB_R - h, w, h);
  }
}

function loop(ts){
  const dt = Math.min(50, ts - lastFrameTime);
  lastFrameTime = ts;
  if (autoCast && debuffs.size === 0 && imgs.length){
    // auto cast: mỗi 1.2s kích hoạt 1 mob random
    if (ts - lastFrameAt > 1200){
      lastFrameAt = ts;
      const m = mobs.find(m => !debuffs.has(m)) || mobs[Math.floor(Math.random()*mobs.length)];
      trigger(m.x, m.y);
    }
  }
  update(dt);
  render();
  requestAnimationFrame(loop);
}

(async () => {
  try {
    await loadAll();
    requestAnimationFrame(ts => { lastFrameTime = ts; loop(ts); });
  } catch(e){
    log.textContent = "⚠️ " + e.message + " — hãy nhúng FRAME_DATA.";
  }
})();

document.getElementById("btnAuto").onclick = e => { autoCast = !autoCast; e.target.classList.toggle("on", autoCast); };
document.getElementById("btnScale").onclick = e => { scale2x = !scale2x; e.target.textContent = "Scale x2: " + (scale2x?"ON":"OFF"); };
</script>
</body>
