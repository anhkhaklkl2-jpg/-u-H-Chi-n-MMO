<style>

<body>
<h1>🧱 Earth Wall — tường đất: mọc lên → giữ 2.5s (hitbox chặn đạn) → end thụt xuống; đạn quá mạnh = bỏ end, fade 0.5s</h1>
<div>
  <button id="btnAuto" class="on">Tự cast (loop)</button>
  <button id="btnScale">Scale x2: ON</button>
  <button id="btnShoot">🔥 Bắn đạn thử vào tường</button>
</div>
<div id="info">Click trên canvas = dựng tường tại đó. Nút "Bắn đạn thử" = bắn đạn vào tường hold gần nhất.</div>
<div id="log">—</div>
<canvas id="stage" width="480" height="270"></canvas>

// frame_08 là FINAL theo user; 02-07 mọc lên, 09-14 end thụt xuống
const GROW_FRAMES = ["frame_02.png","frame_03.png","frame_04.png","frame_05.png","frame_06.png","frame_07.png"];
const FINAL_FRAME = "frame_08.png";
const END_FRAMES = ["frame_09.png","frame_10.png","frame_11.png","frame_12.png","frame_13.png","frame_14.png"];

// ============================================================
// 🧱 SPELL CONFIG — CHỈNH Ở ĐÂY
// ============================================================
const SPELL = {
  fps: 12,               // fps animation mọc/end
  finalHoldMs: 2500,     // tường giữ (sống) bao lâu sau khi mọc xong
  wallBlockW: 15,        // bề ngang hitbox tường — ÔM SÁT phần đậm của sprite frame_08 (solid bbox 15×24)
  wallBlockH: 24,        // bề cao hitbox tường
  wallMaxHp: 40,         // HP tường — dmg tổng cộng; quá → tường mất NGAY KHÔNG frame end, thay bằng fade
  destroyedFadeMs: 500,  // mờ dần khi bị phá
};

// ============================================================
// ⚙️ ENGINE (đừng sửa khi vibe code)
// ============================================================
const imgs = new Map();
async function init(){
  for (const k of Object.keys(FRAME_DATA)){
    await new Promise((res, rej) => { const im = new Image(); im.src = "data:image/png;base64," + FRAME_DATA[k]; im.onload = () => { imgs.set(k, im); res(); }; im.onerror = () => rej(new Error("missing " + k)); });
  }
  requestAnimationFrame(ts => { lastFrameTime = ts; loop(ts); });
}

let autoCast = true, scale2x = true, lastFrameTime = 0;
const caster = { x: 60, y: 140 };
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const log = document.getElementById("log");

const mobs = [{ x: 320, y: 110, hp: 50, maxHp: 50 }, { x: 150, y: 200, hp: 50, maxHp: 50 }];
const MOB_R = 13;

let walls = [];   // {x, y, phase:'grow'|'hold'|'end'|'destroy', frame, t, hp, alpha}
let bullets = []; // {x, y, vx, vy, dmg}

function rectOf(w){ // hitbox ÔM SÁT tường: bbox phần đậm của frame_08 lui về gốc sprite (solid 16..30 x15..38 trong 48×48)
  const s = scale2x ? 2 : 1;
  const bw = SPELL.wallBlockW * s, bh = SPELL.wallBlockH * s;
  const leftInSprite = 16 * s, topInSprite = 15 * s; // gốc bbox trong frame gốc 48×48
  const imgW = 48 * s, imgH = 48 * s;
  const dx = w.x - imgW/2;  // góc trái ảnh (giống drawImage)
  const dy = w.y - imgH;    // góc trên ảnh
  return {
    x: dx + leftInSprite,
    y: dy + topInSprite,
    w: bw, h: bh,
    bottom: dy + topInSprite + bh,
  };
}

function cast(tx, ty){
  walls.push({ x: tx, y: ty, phase: "grow", frame: 0, t: 0, hp: SPELL.wallMaxHp, alpha: 1 });
  log.textContent = "🧱 DỰNG TƯỜNG tại (" + Math.round(tx) + "," + Math.round(ty) + ") — hold " + SPELL.finalHoldMs + "ms, HP " + SPELL.wallMaxHp;
}

canvas.addEventListener("click", e => {
  const r = canvas.getBoundingClientRect();
  cast((e.clientX - r.left) * canvas.width / r.width, (e.clientY - r.top) * canvas.height / r.height);
});

function shootAtNearestWall(){
  let best = null, bestD = Infinity;
  for (const w of walls) if (w.phase === "hold"){ const d = Math.abs(w.x-caster.x); if (d < bestD){ bestD = d; best = w; } }
  if (!best){ log.textContent = "Không có tường hold nào để bắn."; return; }
  const dmg = 25; // đạn thử dmg cố định lớn — 1 phát vỡ nếu wallMaxHp 40, 2 phát nếu chỉnh cao hơn
  const r = rectOf(best);
  const dirX = Math.sign(best.x - caster.x) || 1;
  const yHit = r.y + Math.random() * r.h; // bay vào bất kỳ đâu trên mặt tường
  bullets.push({ x: caster.x, y: yHit, vx: dirX * 0.4, vy: 0, dmg });
  log.textContent = "🔥 Đạn dmg=" + dmg + " → tường (" + Math.round(best.x) + "," + Math.round(best.y) + ")";
}

document.getElementById("btnShoot").onclick = () => shootAtNearestWall();

function drawChecker(){
  ctx.fillStyle = "#1c2430"; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = "#232c3a";
  for (let y=0;y<canvas.height;y+=24) for (let x=0;x<canvas.width;x+=24) if (((x+y)/24)%2===0) ctx.fillRect(x,y,24,24);
  ctx.fillStyle = "#fc0"; ctx.fillRect(caster.x-4, caster.y-4, 8, 8);
  ctx.strokeStyle = "#000"; ctx.strokeRect(caster.x-4, caster.y-4, 8, 8);
}

function drawFrameAt(im, w, alpha){
  const s = scale2x ? 2 : 1;
  const h = im.height * s;
  ctx.save();
  ctx.globalAlpha = (alpha === undefined ? 1 : alpha);
  ctx.drawImage(im, w.x - im.width*s/2, w.y - h, im.width*s, h);
  ctx.restore();
}

function update(dt){
  for (const w of walls){
    if (w.phase === "grow"){
      w.t += dt;
      if (w.t >= 1000/SPELL.fps){ w.t = 0; w.frame++; if (w.frame >= GROW_FRAMES.length){ w.phase = "hold"; w.t = 0; } }
    } else if (w.phase === "hold"){
      w.t += dt;
      if (w.t >= SPELL.finalHoldMs){ w.phase = "end"; w.frame = 0; w.t = 0; log.textContent = "🧱 hết hạn — end thụt xuống"; }
    } else if (w.phase === "end"){
      w.t += dt;
      if (w.t >= 1000/SPELL.fps){ w.t = 0; w.frame++; if (w.frame >= END_FRAMES.length){ w.done = true; } }
    } else if (w.phase === "destroy"){
      w.t += dt;
      w.alpha = Math.max(0, 1 - w.t / SPELL.destroyedFadeMs);
      if (w.t >= SPELL.destroyedFadeMs){ w.done = true; log.textContent = "💥 tường vỡ — fade xong"; }
    }
  }
  walls = walls.filter(w => !w.done);

  // đạn bay + chặn bởi tường
  for (const b of bullets){
    const nx = b.x + b.vx*dt, ny = b.y + b.vy*dt;
    let blocked = false;
    for (const w of walls){
      if (w.phase === "hold" || w.phase === "grow"){
        const r = rectOf(w);
        if ((Math.min(b.x,nx) <= r.x+r.w) && (Math.max(b.x,nx) >= r.x) && ny >= r.y && ny <= r.bottom){
          w.hp -= b.dmg;
          blocked = true;
          if (w.hp <= 0){
            w.phase = "destroy"; w.t = 0;
            log.textContent = "💥 Tường VỠ NGAY (dmg quá lớn) — KHÔNG frame end, fade " + SPELL.destroyedFadeMs + "ms";
          } else {
            log.textContent = "🛡️ Đạn bị CHẶN (tường còn " + w.hp + "/" + SPELL.wallMaxHp + ")";
          }
          break;
        }
      }
    }
    if (!blocked){ b.x = nx; b.y = ny; }
    else b.dead = true;
    if (b.x > canvas.width + 20 || b.x < -20) b.dead = true;
  }
  bullets = bullets.filter(b => !b.dead);
}

function render(){
  drawChecker();
  for (const m of mobs){
    ctx.fillStyle = "#a33"; ctx.fillRect(m.x-MOB_R, m.y-MOB_R, MOB_R*2, MOB_R*2);
    ctx.strokeStyle = "#000"; ctx.strokeRect(m.x-MOB_R, m.y-MOB_R, MOB_R*2, MOB_R*2);
    ctx.fillStyle = "#300"; ctx.fillRect(m.x-MOB_R, m.y-MOB_R-7, MOB_R*2, 4);
    ctx.fillStyle = "#4d4"; ctx.fillRect(m.x-MOB_R, m.y-MOB_R-7, MOB_R*2*(m.hp/m.maxHp), 4);
    ctx.fillStyle = "#fff"; ctx.font = "9px monospace"; ctx.textAlign = "center";
    ctx.fillText(m.hp+"/"+m.maxHp, m.x, m.y+MOB_R+10);
  }
  for (const w of walls){
    if (w.phase === "grow") drawFrameAt(imgs.get(GROW_FRAMES[w.frame]), w, 1);
    else if (w.phase === "hold"){
      drawFrameAt(imgs.get(FINAL_FRAME), w, 1);
      const r = rectOf(w);
      ctx.fillStyle="#000"; ctx.fillRect(r.x, r.y-6, r.w, 3);
      ctx.fillStyle="#4d4"; ctx.fillRect(r.x, r.y-6, r.w*(w.hp/SPELL.wallMaxHp), 3);
    }
    else if (w.phase === "end") drawFrameAt(imgs.get(END_FRAMES[w.frame]), w, 1);
    else if (w.phase === "destroy") drawFrameAt(imgs.get(FINAL_FRAME), w, w.alpha);
  }
  ctx.fillStyle = "#4cf";
  for (const b of bullets){ ctx.fillRect(b.x-3, b.y-2, 6, 4); }
  // debug hitbox đã bỏ (final) — wallBlockW/H vẫn hoạt động
}

function loop(ts){
  const dt = Math.min(50, ts - lastFrameTime);
  lastFrameTime = ts;
  if (autoCast && walls.length === 0) cast(280 + Math.random()*120, 120 + Math.random()*80);
  update(dt);
  render();
  requestAnimationFrame(loop);
}

document.getElementById("btnAuto").onclick = e => { autoCast = !autoCast; e.target.classList.toggle("on", autoCast); };
document.getElementById("btnScale").onclick = e => { scale2x = !scale2x; e.target.textContent = "Scale x2: " + (scale2x?"ON":"OFF"); };

(init)();
</script>
</body>
</html>
