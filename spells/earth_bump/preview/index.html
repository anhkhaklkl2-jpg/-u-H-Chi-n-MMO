// ============================================================
// 🪨 SPELL CONFIG — CHỈNH Ở ĐÂY
// ============================================================
const SPELL = {
  emergePx: 40,         // khoảng cách khỏi player (px)
  fps: 12,              // fps animation bump
  knockRadius: 40,      // bán kính đẩy địch quanh bump (px)
  knockForce: 30,       // cường độ đẩy (px tổng)
};
const CAST_MS = 100;

// ============================================================
// ⚙️ ENGINE (đừng sửa)
// ============================================================
const imgs = new Map();
function load(src){ return new Promise((res, rej) => { const im = new Image(); im.src = "data:image/png;base64," + FRAME_DATA[src]; im.onload = () => res(im); im.onerror = () => rej(new Error("missing frame " + src)); }); }

let autoCast = true, scale2x = true;
let lastFrameTime = 0;
const caster = { x: 60, y: 140 };
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const log = document.getElementById("log");

const mobs = [{ x: 320, y: 110, hp: 50, maxHp: 50, pushX:0, pushY:0 }, { x: 150, y: 200, hp: 50, maxHp: 50, pushX:0, pushY:0 }];
const MOB_R = 13;
let bumps = [];   // {x,y,dirFrame,frame,t,data}

async function init(){
  for (const k of Object.keys(FRAME_DATA)) imgs.set(k, await load(k));
  requestAnimationFrame(ts => { lastFrameTime = ts; loop(ts); });
}

function cast(tx, ty){
  // bump tạo cách player 10px về phía mục tiêu; lật trái/phải (flip ngang)
  const dx = tx - caster.x, dy = ty - caster.y;
  const dist = Math.hypot(dx, dy) || 1;
  const bx = caster.x + dx / dist * SPELL.emergePx;
  const by = caster.y + dy / dist * SPELL.emergePx;
  const facingRight = dx >= 0;   // lật: mục tiêu bên phải → sprite mặt phải, trái → mặt trái
  bumps.push({ x: bx, y: by, facingRight, frame: 0, t: 0 });
  log.textContent = "🪨 BUMP tại (" + Math.round(bx) + "," + Math.round(by) + ") " + (facingRight ? "n_Display mặt phải" : "mặt trái") + " — knock=" + SPELL.knockRadius + "px";
  // đẩy địch
  for (const m of mobs){
    const ddx = m.x - bx, ddy = m.y - by;
    const d = Math.hypot(ddx, ddy);
    if (d < SPELL.knockRadius){
      const f = (1 - d / SPELL.knockRadius) * SPELL.knockForce;
      const nd = d || 1;
      m.pushX += (ddx/nd) * f;
      m.pushY += (ddy/nd) * f;
      log.textContent += " | ĐẨY mob (" + Math.round(m.x) + "," + Math.round(m.y) + ")";
    }
  }
}

canvas.addEventListener("click", e => {
  const r = canvas.getBoundingClientRect();
  cast((e.clientX - r.left) * canvas.width / r.width, (e.clientY - r.top) * canvas.height / r.height);
});

function drawChecker(){
  ctx.fillStyle = "#1c2430"; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = "#232c3a";
  for (let y=0;y<canvas.height;y+=24) for (let x=0;x<canvas.width;x+=24) if (((x+y)/24)%2===0) ctx.fillRect(x,y,24,24);
  // vòng bán kính đẩy debug đã bỏ — knockRadius vẫn hoạt động
  ctx.fillStyle = "#fc0"; ctx.fillRect(caster.x-4, caster.y-4, 8, 8);
  ctx.strokeStyle = "#000"; ctx.strokeRect(caster.x-4, caster.y-4, 8, 8);
}

function update(dt){
  for (const b of bumps){
    b.t += dt;
    if (b.t >= 1000/SPELL.fps){ b.t = 0; b.frame++; }
  }
  // áp lực đẩy vào vị trí mob, dập tắt dần
  for (const m of mobs){
    m.x += m.pushX * dt * 0.01;
    m.y += m.pushY * dt * 0.01;
    m.pushX *= 0.9; m.pushY *= 0.9;
  }
  bumps = bumps.filter(b => b.frame < Object.keys(FRAME_DATA).length);
}

function render(){
  drawChecker();
  const s = scale2x ? 2 : 1;
  for (const m of mobs){
    ctx.fillStyle = "#a33"; ctx.fillRect(m.x-MOB_R, m.y-MOB_R, MOB_R*2, MOB_R*2);
    ctx.strokeStyle = "#000"; ctx.strokeRect(m.x-MOB_R, m.y-MOB_R, MOB_R*2, MOB_R*2);
    ctx.fillStyle = "#300"; ctx.fillRect(m.x-MOB_R, m.y-MOB_R-7, MOB_R*2, 4);
    ctx.fillStyle = "#4d4"; ctx.fillRect(m.x-MOB_R, m.y-MOB_R-7, MOB_R*2*(m.hp/m.maxHp), 4);
    ctx.fillStyle = "#fff"; ctx.font = "9px monospace"; ctx.textAlign = "center";
    ctx.fillText(m.hp+"/"+m.maxHp, m.x, m.y+MOB_R+10);
  }
  for (const b of bumps){
    const key = "frame_" + String(b.frame+1).padStart(2,"0") + ".png";
    const im = imgs.get(key);
    if (!im) continue;
    const w = im.width*s, h = im.height*s;
    ctx.save();
    ctx.translate(b.x, b.y + h*0.35);  // chân bump align ~ chân mob
    if (!b.facingRight) ctx.scale(-1, 1);  // LẬT NGANG TRÁI/PHẢI — không xoay
    ctx.drawImage(im, -w/2, -h, w, h);
    ctx.restore();
  }
}

function loop(ts){
  const dt = Math.min(50, ts - lastFrameTime);
  lastFrameTime = ts;
  if (autoCast && bumps.length === 0){
    const m = mobs[Math.floor(Math.random()*mobs.length)];
    cast(m.x + (Math.random()*2-1)*20, m.y + (Math.random()*2-1)*20);
  }
  update(dt);
  render();
  requestAnimationFrame(loop);
}

document.getElementById("btnAuto").onclick = e => { autoCast = !autoCast; e.target.classList.toggle("on", autoCast); };
document.getElementById("btnScale").onclick = e => { scale2x = !scale2x; e.target.textContent = "Scale x2: " + (scale2x?"ON":"OFF"); };

(init)();
</script>
