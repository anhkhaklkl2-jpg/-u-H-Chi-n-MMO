const LIFT_MS = 600;        // thời gian vận chiêu: đá nổi từ chân lên (frame 1-6 loop)
const LIFT_RISE = 26;       // độ cao đá nổi (px, "hơn đầu player 1 tý" — chỉnh được)
const FLY_MS = 450;         // thời gian ném bay tới đích
const ROCK_FPS = 6;         // fps loop đá khi vận chiêu/bay
const IMPACT_FPS = 10;      // fps animation impact (rock hit + overlay chạy song song)

// ====== SPELL CONFIG ======
const SPELL = {
  name: "Earth Rock Lift",
  dmg: 18,
  dmgVariance: 5,
  impactRadius: 30,
  impactShake: 3,
  impactShakeMs: 150,
  impactScale: 1.0,
  overlayYOffset: 14,     // overlay impact nằm BÊN DƯỚI frame rock hit bao nhiêu px
  arcHeight: 11,          // độ cao vòng cung khi bay (px, 0 = bay thẳng) — giảm 20% từ 14
  spinTurns: 0.4,         // số vòng xoay khi bay (0 = không xoay) — giảm 20% từ 0.5
};

// ====== ENGINE ======
const imgs = new Map();
function load(src){ return new Promise((res, rej) => { const im = new Image(); im.src = "data:image/png;base64," + FRAME_DATA[src]; im.onload = () => res(im); im.onerror = () => rej(new Error("missing frame: " + src)); }); }

let autoCast = true, scale2x = true;
let lastFrameTime = 0;
const caster = { x: 100, y: 150 };
let projectiles = [];
let shakeUntil = 0, shakeMag = 0;

const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const log = document.getElementById("log");

const mobs = [{ x: 340, y: 110, hp: 60, maxHp: 60 }, { x: 160, y: 210, hp: 60, maxHp: 60 }];
const MOB_R = 12;
let floaters = [];

function applyDamage(p){
  if (p.hitApplied) return;
  p.hitApplied = true;
  for (const m of mobs){
    const dx = m.x - p.targetX, dy = m.y - p.targetY;
    if (dx*dx + dy*dy <= SPELL.impactRadius * SPELL.impactRadius){
      const dmg = Math.max(1, SPELL.dmg + Math.round((Math.random()*2-1) * SPELL.dmgVariance));
      m.hp = Math.max(0, m.hp - dmg);
      p.hitMob = m; p.dmgDealt = dmg;
      if (SPELL.impactShake > 0){ shakeUntil = performance.now() + SPELL.impactShakeMs; shakeMag = SPELL.impactShake; }
      floaters.push({ x: m.x, y: m.y - 16, text: "-" + dmg, t: 0 });
    }
  }
}

// vị trí "chân player" khi vận chiêu: đá xuất phát dưới chân, nổi lên LIFT_RISE px
const footOffset = 6;   // đá nằm hơi dưới tâm player

function cast(tx, ty){
  projectiles.push({ targetX: tx, targetY: ty, phase: "lift", t: 0, animAcc: 0, rockFrame: 0, rockHitFrame: 0, impactFxFrame: 0, done: false, hitApplied: false });
  log.textContent = "VẬN CHIÊU → (" + Math.round(tx) + ", " + Math.round(ty) + ") lift=" + LIFT_MS + "ms +" + LIFT_RISE + "px, fly=" + FLY_MS + "ms, dmg=" + SPELL.dmg + "±" + SPELL.dmgVariance;
}

canvas.addEventListener("click", e => {
  const r = canvas.getBoundingClientRect();
  cast((e.clientX - r.left) * canvas.width / r.width, (e.clientY - r.top) * canvas.height / r.height);
});

function drawChecker(){
  ctx.fillStyle = "#1c2430";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = "#232c3a";
  for (let y=0; y<canvas.height; y+=24)
    for (let x=0; x<canvas.width; x+=24)
      if (((x+y)/24)%2===0) ctx.fillRect(x,y,24,24);
  // player (caster) — thân player đơn giản để thấy đá nổi TỪ CHÂN
  ctx.fillStyle = "#fc0";
  ctx.fillRect(caster.x-6, caster.y-14, 12, 20);   // thân
  ctx.fillStyle = "#a70";
  ctx.fillRect(caster.x-6, caster.y+6, 12, 4);     // chân
}

function drawSprite(im, x, y, scale, rot){
  const s = scale2x ? 2 : 1;
  const w = im.width * s * scale, h = im.height * s * scale;
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  if (rot) ctx.rotate(rot);
  ctx.drawImage(im, -w/2, -h/2, w, h);
  ctx.restore();
}

function update(dt){
  for (const p of projectiles){
    p.t += dt;
    if (p.phase === "lift"){
      // KHÔNG cộng animAcc 2 lần (dòng `p.animAcc += dt` chung cũ làm acc tăng kép,
      // khiến lift loop về frame đầu đúng lúc chuyển phase → nháy 1 frame)
      p.animAcc = (p.animAcc || 0) + dt;
      if (p.animAcc >= 1000 / ROCK_FPS){ p.animAcc = 0; p.rockFrame = (p.rockFrame + 1) % ROCK.length; }
      if (p.t >= LIFT_MS){
        p.phase = "fly"; p.t = 0;
        // gán vị trí NGAY LÚC CHUYỂN phase — trùng khít điểm lift kết thúc (không nhảy)
        p.x = caster.x; p.y = caster.y + footOffset - LIFT_RISE; p.rot = 0;
      }
    } else if (p.phase === "fly"){
      // frame CỨNG duy nhất khi bay: irregular_rock/frame_06.png (index 5) — không anim
      p.rockFrame = 5;
      // cảm giác "bị QUĂNG đi": ease-in (chậm đầu, nhanh cuối) + vòng cung nhỏ
      const raw = Math.min(1, p.t / FLY_MS);
      const prog = raw * raw;                      // ease-in: tăng tốc dần như bị ném
      p.x = caster.x + (p.targetX - caster.x) * prog;
      // điểm BẮT ĐẦU bay = đúng vị trí lift kết thúc (footOffset - LIFT_RISE) — không nhảy 6px gây nháy
      const startY = caster.y + footOffset - LIFT_RISE;
      p.y = startY + (p.targetY - startY) * prog;
      // vòng cung: núp lên một chút giữa chặng rồi rơi xuống
      const arc = Math.sin(raw * Math.PI) * SPELL.arcHeight;
      p.y -= arc;
      p.rot = raw * (SPELL.spinTurns * Math.PI * 2); // xoay tròn trong lúc bay
      if (p.t >= FLY_MS){
        p.phase = "impact"; p.t = 0; p.animAcc = 0; applyDamage(p);
        // giữ vị trí đích ngay khi chuyển impact — không vẽ nháy
        p.x = p.targetX; p.y = p.targetY;
      }
    } else if (p.phase === "impact"){
      p.animAcc += dt;   // acc impact tự cộng riêng (dòng dùng chung đã bỏ)
      if (p.animAcc >= 1000 / IMPACT_FPS){
        p.animAcc = 0;
        if (!p.rockHitDone){
          p.rockHitFrame++;
          if (p.rockHitFrame >= ROCK_HIT.length) p.rockHitDone = true;
        }
        if (!p.impactFxDone){
          p.impactFxFrame++;
          if (p.impactFxFrame >= IMPACT_FX.length) p.impactFxDone = true;
        }
        if (p.rockHitDone && p.impactFxDone) p.done = true;
      }
    }
  }
  for (const f of floaters){ f.t += dt; f.y -= dt * 0.03; }
  floaters = floaters.filter(f => f.t < 700);
  projectiles = projectiles.filter(p => !p.done);
}

function render(){
  drawChecker();
  ctx.save();
  if (performance.now() < shakeUntil) ctx.translate((Math.random()*2-1)*shakeMag, (Math.random()*2-1)*shakeMag);
  for (const m of mobs){
    ctx.fillStyle = "#a33"; ctx.fillRect(m.x-MOB_R, m.y-MOB_R, MOB_R*2, MOB_R*2);
    ctx.strokeStyle = "#000"; ctx.strokeRect(m.x-MOB_R, m.y-MOB_R, MOB_R*2, MOB_R*2);
    ctx.fillStyle = "#300"; ctx.fillRect(m.x-MOB_R, m.y-MOB_R-7, MOB_R*2, 4);
    ctx.fillStyle = "#4d4"; ctx.fillRect(m.x-MOB_R, m.y-MOB_R-7, MOB_R*2 * (m.hp/m.maxHp), 4);
    ctx.fillStyle = "#fff"; ctx.font = "9px monospace"; ctx.textAlign = "center";
    ctx.fillText(m.hp + "/" + m.maxHp, m.x, m.y + MOB_R + 10);
  }
  ctx.font = "bold 11px monospace";
  for (const f of floaters){
    ctx.globalAlpha = 1 - f.t/700; ctx.fillStyle = "#fd4";
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  for (const p of projectiles){
    if (p.phase === "lift"){
      // đá nổi từ chân player lên — fade-in nhẹ lúc đầu
      const im = imgs.get(ROCK[p.rockFrame]);
      if (im){
        const rise = Math.min(1, p.t / LIFT_MS);
        const y = (caster.y + footOffset) - LIFT_RISE * rise;
        if (p.t < 150) ctx.globalAlpha = p.t / 150;
        drawSprite(im, caster.x, y, 1);
        ctx.globalAlpha = 1;
      }
    } else if (p.phase === "fly"){
      const im = imgs.get(ROCK[p.rockFrame]);
      if (im) drawSprite(im, p.x, p.y, 1, p.rot || 0);
    } else if (p.phase === "impact"){
      // overlay impact BÊN DƯỚI rock hit (vẽ trước, rock đè lên)
      const fx = imgs.get(IMPACT_FX[p.impactFxFrame]);
      if (fx) drawSprite(fx, p.targetX, p.targetY + SPELL.overlayYOffset, 1);
      // frame 06 giữ làm nền 2 frame đầu impact — frame_07 rất mỏng (13% đục) nên không có nền sẽ thấy 1 frame "trong suốt"
      if (p.rockHitFrame < 2){
        const base = imgs.get(ROCK[5]);
        if (base) drawSprite(base, p.targetX, p.targetY, 1);
      }
      const rock = imgs.get(ROCK_HIT[p.rockHitFrame]);
      if (rock && p.rockHitFrame < ROCK_HIT.length) drawSprite(rock, p.targetX, p.targetY, 1);
    }
  }
  ctx.restore();
}

function loop(ts){
  const dt = Math.min(50, ts - lastFrameTime);
  lastFrameTime = ts;
  if (autoCast && projectiles.length === 0){
    let tx, ty;
    if (Math.random() < 0.7){
      const m = mobs[Math.floor(Math.random()*mobs.length)];
      tx = m.x + (Math.random()*2-1)*10; ty = m.y + (Math.random()*2-1)*10;
    } else { tx = 200 + Math.random()*240; ty = 60 + Math.random()*150; }
    cast(tx, ty);
  }
  update(dt);
  render();
  requestAnimationFrame(loop);
}

(async () => {
  try {
    for (const src of [...ROCK, ...ROCK_HIT, ...IMPACT_FX]) imgs.set(src, await load(src));
    requestAnimationFrame(ts => { lastFrameTime = ts; loop(ts); });
  } catch(e){
    log.textContent = "⚠️ " + e.message;
  }
})();

document.getElementById("btnAuto").onclick = e => { autoCast = !autoCast; e.target.classList.toggle("on", autoCast); };
document.getElementById("btnScale").onclick = e => { scale2x = !scale2x; e.target.textContent = "Scale x2: " + (scale2x?"ON":"OFF"); };
</script>
</body>
</html>
